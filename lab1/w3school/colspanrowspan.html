<!doctype html>
<html>
    <head> 
        <meta charset = "utf-8">
        <title>Zhaisan</title>
        <style>
            table, tr, td, th{
                border: 1px solid black;
                border-collapse: collapse;
                margin: 10px;
            }
        </style>
    </head>
    <body>
        <h1>creating rowspan, colspan</h1>
        <table> 
            <tr> 
                <th colspan = "2">Name</th>
                <th>Age</th>
            </tr>
            <tr>
                <td>Jill</td>
                <td>Smith</td>
                <td>43</td>
            </tr>
            <tr>
                <td>Eve</td>
                <td>Jackson</td>
                <td>57</td>
            </tr>
        </table>
        <table>
            <tr>
                <th>Name</th>
                <td>Jill</td>
            </tr>
            <tr>
               <th rowspan = "2">Phone</th>
               <td>555-1234</td>
            </tr>
            <tr>
                <td>555-8745</td>
            </tr>
        </table>
    </body>
</html>
