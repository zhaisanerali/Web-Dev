<div class="card">
  <img [src]="product.image" [alt]="product.name" class="main-img">
  
  <div class="info">
    <h3>{{ product.name }}</h3>
    <p class="description">{{ product.description }}</p>
    <div class="price">{{ product.price | number }} ₸</div>
    <div class="rating">⭐ {{ product.rating }}</div>
  </div>

  <div class="actions">
    <a [href]="product.link" target="_blank" class="kaspi-btn">На Kaspi.kz</a>
    <div class="share-buttons">
      <button (click)="share('wa')" class="wa-btn">WA</button>
      <button (click)="share('tg')" class="tg-btn">TG</button>
    </div>
  </div>
</div>
